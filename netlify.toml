[build]
  publish = "public"
  command = "hugo --minify"

[build.environment]
  HUGO_VERSION = "0.162.1"
  HUGO_ENVIRONMENT = "production"

[[redirects]]
  from = "/work-with-us"
  to = "/work-with-me/"
  status = 301

[[redirects]]
  from = "/work-with-us/"
  to = "/work-with-me/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
