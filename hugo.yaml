baseURL: "https://moments-by-lp.com/"
locale: "en-us"
title: "Moments by LP | Commercial Brand Photographer Boca Raton"

enableRobotsTXT: true

params:
  description: "Commercial brand photographer in Boca Raton, FL specializing in lifestyle brands — beauty, jewelry, coffee, fashion, wellness, and hospitality. Premium photography and content creation for South Florida businesses."
  businessName: "Moments by LP Photography"
  phone: ""
  email: "momentsbylpstudios@gmail.com"
  bookingURL: ""
  city: "Boca Raton"
  state: "FL"
  region: "South Florida"
  ogImage: "/images/lauren-garden.jpg"
  ogImageWidth: 1170
  ogImageHeight: 1454
  ogImageVersion: "2"
  social:
    instagram: "https://www.instagram.com/momentsbylp"
    facebook: ""
    pinterest: ""
  mailerlite:
    accountId: ""   # MailerLite → Account → API → Account ID
    formId: ""      # MailerLite → Forms → your embedded form → ID in the embed code

  # ── Creative Journal ───────────────────────────────────────────────────────
  creativeJournal:
    communityURL: "/creator-community/"
    eventsURL: "/magazine/events/"
    projectURL: "/book-a-brand-call/"
    # TODO: Set CRM/form endpoints when MailerLite / GoHighLevel are ready
    # communityJoinAction: use "/.netlify/functions/community-join" after GHL env vars are set
    # See docs/ghl-community-form.md
    forms:
      communityJoinAction: ""
      communityWaitlistAction: ""
      speakingInquiryAction: ""
      newsletterAction: ""

  # ── Shopify Integration ──────────────────────────────────────────────────
  # Public values only. Never put Admin API keys or private tokens here.
  # See docs/shopify-integration.md for setup instructions.
  shopify:
    enabled: true         # Set to false to hide all shop UI site-wide
    storeDomain: "PLACEHOLDER.myshopify.com"          # e.g. moments-by-lp.myshopify.com
    storefrontToken: "PLACEHOLDER_STOREFRONT_TOKEN"   # Shopify → Apps → Custom App → Storefront API token
    currency: "USD"
    cartType: "drawer"    # drawer | page
    showHomepageSection: true   # Show "Made for People Who Create" section on homepage

sitemap:
  changefreq: "weekly"
  priority: 0.5
  filename: "sitemap.xml"

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS
  taxonomy:
    - HTML
  term:
    - HTML
