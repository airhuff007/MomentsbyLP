<script>
(function () {
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var page = document.querySelector('.about-page');
  if (!page) return;

  /* ── Scroll reveal ── */
  var reveals = page.querySelectorAll('.about-reveal');
  if (reveals.length && !reduced) {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });

    reveals.forEach(function (el) {
      var delay = el.getAttribute('data-delay');
      if (delay) el.style.transitionDelay = delay + 'ms';
      observer.observe(el);
    });

    /* Hero animates on load */
    var hero = page.querySelector('.about-hero, .pkg-hero');
    if (hero) {
      hero.querySelectorAll('.about-reveal').forEach(function (el) {
        requestAnimationFrame(function () {
          el.classList.add('is-visible');
        });
      });
    }
  } else if (reveals.length) {
    reveals.forEach(function (el) { el.classList.add('is-visible'); });
  }

  if (reduced) return;

  /* ── Camera parallax ── */
  var cameras = document.querySelectorAll('.about-camera');
  var speeds = [0.08, -0.06, 0.1, -0.07, 0.09, -0.05];
  var rotates = [0.008, -0.006, 0.01, -0.007, 0.009, -0.005];
  var parallaxImgs = document.querySelectorAll('.about-parallax-img');

  function onScroll() {
    var y = window.scrollY;

    cameras.forEach(function (cam, i) {
      var speed = speeds[i] || 0.08;
      var rotate = rotates[i] || 0.008;
      var sway = Math.sin(y * 0.002 + i) * 6;
      cam.style.transform =
        'translate3d(' + sway + 'px,' + (y * speed) + 'px,0) rotate(' + (y * rotate) + 'deg)';
    });

    var heroImg = document.querySelector('.about-hero__bg img');
    if (heroImg) {
      var offset = y * 0.04;
      var hero = heroImg.closest('.about-hero');
      var scale = hero
        ? getComputedStyle(hero).getPropertyValue('--about-hero-bg-scale').trim() || '0.72'
        : '0.72';
      heroImg.style.transform = 'translate3d(0,' + offset + 'px,0) scale(' + scale + ')';
    }

    parallaxImgs.forEach(function (img) {
      var rect = img.getBoundingClientRect();
      var offset = (rect.top + rect.height * 0.5 - window.innerHeight * 0.5) * 0.06;
      img.style.transform = 'translate3d(0,' + offset + 'px,0) scale(1.02)';
    });
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
